# Motion Segmentation Configuration for VGGT
cfg_name: "vggt_motion_fusion_6layers_12frame"

# =============================================================================
# Dataset Configuration
# =============================================================================
train_dataset: ["dynamic_stereo", "hoi4d", "dynamicverse", "mose"]  
train_root: ["/home/jhshen/Experiment/MyMotion/data/dynamic_replica/dynamic_replica_clean/",
             "/home/jhshen/Experiment/MyMotion/data/HOI4D/HOI4D_clean",
             "/home/jhshen/Experiment/MyMotion/data/youtube_vis",
             "/home/jhshen/Experiment/MyMotion/data/MOSE/"
]

# Test datasets
test_dataset: ["test"]  
test_root: ["/home/jhshen/Experiment/MyMotion/data/dynamic_replica/dynamic_replica_clean/"]

# Data loading settings
num_workers: 1
batch_size: 2  # 100帧长序列下，单卡Batch Size必须为1以防止显存溢出
enable_augmentation: true
# crop_strategy: "center"

# 关键：时空采样设置
img_size: 512               # VGGT-omega 推荐尺寸
sequence_length: 12         # 训练时序列长度，建议为 12 

# 数据集混合策略
dataset_sampling_strategy: 'probabilistic' 
dataset_probabilities: [0.15, 0.35, 0.25, 0.25] 

# =============================================================================
# VGGT Model Configuration  
# =============================================================================
model_name: "vggt_motion_seg"
vggt_omega_model_path: "checkpoints/vggt_omega_1b_512.pt"  # VGGT Omega 官方预训练权重路径
raft_model_path: "./raft_large_C_T_SKHT_V2-ff5fadd5.pth"
freeze_backbone: true                    # 冻结 VGGT omega，只练 Fusion 和 Decoder
use_flow_residual: true


# 架构超参数 (对应代码中的逻辑)
patch_size: 14
decoder_stride: 16
embed_dim: 1024

motion_decoder_depth: 5                  # 5 层 Motion Decoder

# =============================================================================
# Loss Configuration
# =============================================================================
bce_weight: 1.0
dice_weight: 1.0
consistency_weight: 0.0     # 物理一致性 Loss 权重 (基于 3D 点运动)

# =============================================================================
# Training Configuration
# =============================================================================
max_epochs: 40
lr: 0.00005                 # 初始学习率 (适用于 AdamW)
weight_decay: 0.05
min_lr: 0.000005            # Cosine 退火的最小学习率
gradient_clip: 1.0          # 防止长序列训练梯度爆炸
save_freq: 3000
print_freq: 5

# =============================================================================
# Hardware & Optimization (针对 48G A6000/A40)
# =============================================================================
device: "cuda"
mixed_precision: true       # 必须开启。代码中会自动使用 bfloat16 以适配 A6000
use_gradient_checkpointing: true # 建议在代码中对 Motion Decoder 开启

# =============================================================================
# Logging and Visualization
# =============================================================================
log_dir: "experiments/MyMotion/vggt_omega_v2_geo_cam_depth"

use_geo_feature: true
use_cam_feature: true
use_flow_feature: false
use_depth_feature: true
vis: true
eval:
  metrics: ["iou", "precision", "recall", "f1"]
  threshold: 0.5
  save_predictions: true

# =============================================================================
# Legacy / Compatibility
# =============================================================================
resume_path: null
out_dim: 1