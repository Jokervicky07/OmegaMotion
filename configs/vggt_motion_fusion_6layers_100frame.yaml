# Motion Segmentation Configuration for VGGT
cfg_name: "vggt_motion_fusion_6layers_100frame"

# =============================================================================
# Dataset Configuration
# =============================================================================
# train_dataset: ["got10k", "hoi4d", "dynamic_stereo", "gotmoving", "dynamicverse"]
# train_root: [
#   '/work/jokervicky07/data/GOT10k/GOT-10k_Train_split_01', 
#   "/work/jokervicky07/data/HOI4D/HOI4D_clean", 
#   "/work/jokervicky07/data/dynamic_stereo/dynamic_stereo_clean/train", 
#   '/work/jokervicky07/data/gotmoving', 
#   '/work/jokervicky07/data/DynamicVerse'
# ]

# train_dataset: ["dynamic_stereo", "hoi4d", "dynamicverse", "mose", "gotmoving"]  # 仅使用 Dynamic Stereo、HOI4D 和 DynamicVerse 进行训练
# train_root: ["/home/jhshen/Experiment/Geomotion/data/dynamic_replica/dynamic_replica_clean/",
#              "/home/jhshen/Experiment/Geomotion/data/HOI4D/HOI4D_clean",
#              "/home/jhshen/Experiment/Geomotion/data/youtube_vis",
#              "/home/jhshen/Experiment/Geomotion/data/MOSE/",
#              "/home/jhshen/Experiment/Geomotion/data/got10k/got10k_moving"
# ]

train_dataset: ["dynamic_stereo", "hoi4d", "dynamicverse", "mose"]  # 仅使用 Dynamic Stereo、HOI4D 和 DynamicVerse 进行训练
train_root: ["/home/jhshen/Experiment/Geomotion/data/dynamic_replica/dynamic_replica_clean/",
             "/home/jhshen/Experiment/Geomotion/data/HOI4D/HOI4D_clean",
             "/home/jhshen/Experiment/Geomotion/data/youtube_vis",
             "/home/jhshen/Experiment/Geomotion/data/MOSE/"
]

# Test datasets
test_dataset: ["test"]  
test_root: ["/home/jhshen/Experiment/Geomotion/data/dynamic_replica/dynamic_replica_clean/"]

# Data loading settings
num_workers: 1
batch_size: 2  # 100帧长序列下，单卡Batch Size必须为1以防止显存溢出
enable_augmentation: true
crop_strategy: "center"

# 关键：时空采样设置
img_size: 512               # VGGT-omega 推荐尺寸
sequence_length: 12        # 您要求的 100 帧长序列
sample_stride: 6            # 密集采样以保证运动一致性

# 数据集混合策略
# dataset_sampling_strategy: 'probabilistic' 
# dataset_probabilities: [0.15, 0.2, 0.2, 0.25, 0.2]
dataset_sampling_strategy: 'probabilistic' 
# dataset_probabilities: [0.15, 0.25, 0.20, 0.20, 0.20]
dataset_probabilities: [0.15, 0.35, 0.25, 0.25] # v6
#dataset_probabilities: [0.15, 0.25, 0.30, 0.30]  # HOI4D 和 DynamicVerse 占更大比例，MOSE 也加入训练以增强泛化能力

# =============================================================================
# VGGT Model Configuration  
# =============================================================================
model_name: "vggt_motion_seg"
vggt_model_path: "checkpoints/vggt_omega_1b_512.pt"  # VGGT Omega 官方预训练权重路径
raft_model_path: "./raft_large_C_T_SKHT_V2-ff5fadd5.pth"
freeze_backbone: true                    # 冻结 VGGT omega，只练 Fusion 和 Decoder
# resume_model_path: "/home/jhshen/Experiment/Geomotion/experiments/Geomotion/vggt_100frame_motion_v4/vggt_best_model_v4.pth"

# 架构超参数 (对应代码中的逻辑)
patch_size: 14
decoder_stride: 16
embed_dim: 1024
# selected_layers: [1, 5, 15, 19, 46, 47]  # 提取的 6 层骨干特征
motion_decoder_depth: 5                  # 您要求的 5 层 Motion Decoder

# =============================================================================
# Loss Configuration
# =============================================================================
bce_weight: 1.0
dice_weight: 1.0
consistency_weight: 0.0     # 物理一致性 Loss 权重 (基于 3D 点运动)

# =============================================================================
# Training Configuration
# =============================================================================
max_epochs: 40
lr: 0.00005                 # 初始学习率 (适用于 AdamW)
weight_decay: 0.05
min_lr: 0.000005            # Cosine 退火的最小学习率
gradient_clip: 1.0          # 防止长序列训练梯度爆炸
save_freq: 3000
print_freq: 5

# =============================================================================
# Hardware & Optimization (针对 48G A6000/A40)
# =============================================================================
device: "cuda"
mixed_precision: true       # 必须开启。代码中会自动使用 bfloat16 以适配 A6000
use_gradient_checkpointing: true # 建议在代码中对 Motion Decoder 开启

# =============================================================================
# Logging and Visualization
# =============================================================================
log_dir: "experiments/Geomotion/vggt_omega_v2"
vis: true
eval:
  metrics: ["iou", "precision", "recall", "f1"]
  threshold: 0.5
  save_predictions: true

# =============================================================================
# Legacy / Compatibility
# =============================================================================
resume_path: null
out_dim: 1